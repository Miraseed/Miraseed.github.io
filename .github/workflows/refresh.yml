name: 刷新期权信号
# 交易时段(北京时间 9:30-15:30)每30分钟跑一次 + 收盘后一次
# 北京时间 = UTC+8，cron 用 UTC
on:
  schedule:
    - cron: '35/30 1-7 * * 1-5'   # UTC 01:35~07:35 → 北京 09:35~15:35
    - cron: '5 8 * * 1-5'          # UTC 08:05 → 北京 16:05 收盘补充
  workflow_dispatch: {}            # 手动触发按钮

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 拉取私有主仓库（代码 + 历史面板）
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/Miraseed/etf-option-monitor.git" /tmp/mainrepo
          cp -r /tmp/mainrepo/code ./code
          echo "主仓库已就绪：$(ls code | head -5 | tr '\n' ' ')"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pandas numpy requests scipy pyarrow cryptography

      - name: 抓取数据并生成 data.json
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python build_data.py

      - name: 加密 data.json -> data.bin（密码门）
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: python encrypt_data.py

      - name: 提交数据回仓库（触发 Pages 更新）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.bin docs/history.json docs/push_state.json || true
          git diff --cached --quiet && echo "无变化，跳过提交" || git commit -m "数据更新 $(date -u +%Y-%m-%d_%H:%M) UTC"
          git push
