name: 刷新期权信号
# 交易时段(北京时间 9:30-15:00)每3分钟跑一次；非交易时段降低频率省额度。
# 北京时间 = UTC+8，cron 用 UTC。
#   09:30-11:30 → UTC 01:30-03:30；13:00-15:00 → UTC 05:00-07:00
# 说明：5 个 ETF 走新浪实时链（秒级），中证1000/铁矿石走交易所日终（带30分钟缓存）。
on:
  schedule:
    # 上午盘：每3分钟
    - cron: '*/3 1-3 * * 1-5'
    # 下午盘：每3分钟
    - cron: '*/3 5-7 * * 1-5'
    # 开盘前/午间/收盘后：每30分钟兜底
    - cron: '0,30 0,4,8 * * 1-5'
  workflow_dispatch: {}

# 高频并发保护：同一时刻只跑一个，排队等待而非并发
concurrency:
  group: refresh-signal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 拉取私有主仓库（代码 + 历史面板）
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/Miraseed/etf-option-monitor.git" /tmp/mainrepo
          cp -r /tmp/mainrepo/code ./code
          echo "主仓库已就绪"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -q pandas numpy requests scipy pyarrow cryptography

      - name: 抓取数据并生成 data.json
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python build_data.py

      - name: 加密 data.json -> data.enc.txt（密码门）
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: python encrypt_data.py

      - name: 提交数据回仓库（触发 Pages 更新）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 逐个 add：某个文件不存在时不影响其它文件入暂存区
          for f in docs/data.enc.txt docs/history.json docs/push_state.json docs/ex_cache.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "数据更新 $(date -u +%Y-%m-%d_%H:%M) UTC"
            git push
          fi
