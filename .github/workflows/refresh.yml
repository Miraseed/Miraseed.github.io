name: 刷新期权信号
# 交易时段(北京时间 9:30-15:00)靠「自续跑」保持约 2.5 分钟/轮刷新；
# cron 仅作冷启动与链路中断后的兜底（GitHub 免费版 schedule 高负载会降频甚至跳过）。
# 北京时间 = UTC+8，cron 用 UTC。
#   09:30-11:30 → UTC 01:30-03:30；13:00-15:00 → UTC 05:00-07:00
# 说明：全部 7 个标的走新浪实时链（秒级，BS 反解 IV），全量约 3 秒。
on:
  # 手动触发：勾选「测试推送」后，本轮卡片只打印到 Actions 日志、不真发企微，
  # 并绕过"同一标的当日只推一次""日报当日只发一次"的限制，方便改完排版立刻看效果。
  # 注意 TEST_PUSH 必须作为 env 传给「抓取数据」这一步（实测只写在 workflow
  # 顶层或别处，python 里读不到）；inputs 未传时为 ""，等同于关闭。
  workflow_dispatch:
    inputs:
      test_push:
        description: '测试模式：卡片只打到日志，不真发企微，且不受每日一次限制'
        type: boolean
        default: false
  schedule:
    # 上午盘：每3分钟
    - cron: '*/3 1-3 * * 1-5'
    # 下午盘：每3分钟
    - cron: '*/3 5-7 * * 1-5'
    # 夜盘（铁矿石 21:00-23:00 北京 = 13:00-15:00 UTC）：每3分钟
    - cron: '*/3 13-15 * * 1-5'
    # 开盘前/午间/收盘后：每30分钟兜底
    - cron: '0,30 0,4,8 * * 1-5'

# 高频并发保护：同一时刻只跑一个，排队等待而非并发
concurrency:
  group: refresh-signal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 拉取私有主仓库（代码 + 历史面板）
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # 必须显式指定 master：该仓库默认分支是 main，且 main 落后 master 若干提交
          # （main 上的 push.py 还停在"彩色进度条"之前的版本），不指定会静默跑到旧代码
          git clone --depth 1 -b master "https://x-access-token:${GH_PAT}@github.com/Miraseed/etf-option-monitor.git" /tmp/mainrepo
          cp -r /tmp/mainrepo/code ./code
          # 推送模块只在主仓库维护，必须一并同步（否则 build_data 报"未找到 web/push.py"）
          mkdir -p ./web
          cp -f /tmp/mainrepo/web/push.py ./web/push.py
          # 自检：push.py 必须是主仓库最新版（曾经因为 clone/缓存拿到旧副本，
          # 表面上 workflow 正确、实际跑的是没有新逻辑的旧文件）
          echo "push.py sha1: $(sha1sum ./web/push.py | cut -c1-12)"
          if grep -q "def is_test" ./web/push.py; then
            echo "push.py 含测试模式"
          else
            echo "WARNING: push.py 是旧版（缺测试模式），检查主仓库 master 是否已推送"
          fi
          cp /tmp/mainrepo/web/github_action/build_data.py ./build_data.py
          cp /tmp/mainrepo/web/github_action/build_kline.py ./build_kline.py
          cp /tmp/mainrepo/web/github_action/paper.py ./paper.py
          cp /tmp/mainrepo/web/github_action/filters.py ./filters.py
          cp /tmp/mainrepo/web/github_action/risk_events.py ./risk_events.py
          cp /tmp/mainrepo/web/github_action/gap_data.py ./gap_data.py
          cp /tmp/mainrepo/web/github_action/iv_history.py ./iv_history.py
          cp /tmp/mainrepo/web/github_action/review.py ./review.py
          cp /tmp/mainrepo/web/github_action/encrypt_data.py ./encrypt_data.py
          cp /tmp/mainrepo/web/github_action/selfcheck.py ./selfcheck.py
          cp -f /tmp/mainrepo/web/github_action/backtest.json ./backtest.json || true
          cp -f /tmp/mainrepo/web/github_action/skew_history.json ./skew_history.json || true
          rm -f ./code/push.py
          echo "主仓库已就绪"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -q pandas numpy requests scipy pyarrow cryptography

      - name: 自检（把历史 bug 固化成断言）
        # 只跑纯逻辑断言，不联网、不写文件。失败会直接中止本次运行，
        # 避免带着回归去抓数据、发推送（历史上曾因此发出一批误报事件）。
        run: python selfcheck.py

      - name: 抓取数据并生成 data.json
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          TEST_PUSH: ${{ github.event.inputs.test_push }}
        run: python build_data.py

      - name: 加密 data.json -> data.enc.txt（密码门）
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: python encrypt_data.py

      - name: 提交数据回仓库（触发 Pages 更新）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 逐个 add：某个文件不存在时不影响其它文件入暂存区
          for f in docs/data.enc.txt docs/kline.enc.txt docs/kline_tail.enc.txt docs/iv_pct.enc.txt docs/history.json docs/positions.json docs/push_state.json docs/risk_log.json docs/iv_state.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "数据更新 $(date -u +%Y-%m-%d_%H:%M) UTC"
            # 多个运行可能同时 push（人工触发 + 自续跑），冲突时 rebase 后重试，
            # 避免整个 job 失败导致自续跑链断裂。
            for i in 1 2 3 4 5; do
              if git push 2>&1; then echo "push 成功"; break; fi
              echo "push 失败，rebase 后重试 $i"
              git pull --rebase -X ours origin main || git rebase --abort || true
              sleep 5
            done
          fi

      # GitHub 的 schedule cron 高负载时会大幅降频甚至跳过（*/3 实测经常 10+ 分钟不触发）。
      # 改为交易时段「自续跑」：每次跑完后 sleep 60s 再 dispatch 下一次，形成链条；
      # cron 仅作兜底。链条断裂时（某次失败）由 cron 或手动触发恢复。
      # 用 always() 保证「提交失败」也不断链——否则一次 push 冲突会让链条停掉。
      - name: 交易时段自续跑
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TEST_PUSH: ${{ github.event.inputs.test_push }}
        run: |
          # 测试模式：不续跑（否则等于每 60 秒重发一次测试内容）
          if [ "${TEST_PUSH:-0}" = "1" ]; then echo "测试轮次，不续跑"; exit 0; fi
          H=$(date -u +%H%M); DOW=$(date -u +%u)
          H10=$((10#$H))
          IN_AM=$([ $H10 -ge $((10#0128)) ] && [ $H10 -le $((10#0332)) ] && echo 1 || echo 0)
          IN_PM=$([ $H10 -ge $((10#0458)) ] && [ $H10 -le $((10#0702)) ] && echo 1 || echo 0)
          # 午休（北京 11:33-12:57）：保持续跑但拉长间隔。
          # 目的：链永不断——旧逻辑午休后只能靠 GitHub cron 恢复，而 cron
          # 高负载会降频跳过（2026-10-19 实测下午开盘 40 分钟没触发，
          # 数据卡在午休最后一轮）。公开仓库 Actions 免费无额度压力。
          IN_BREAK=$([ $H10 -ge $((10#0333)) ] && [ $H10 -le $((10#0457)) ] && echo 1 || echo 0)
          # 夜盘：北京 21:00-23:00 = UTC 13:00-15:00（铁矿石期货+期权都在走）。
          # 上限取 1458，保证最后一轮在 23:00 收盘前发出；收盘后由 cron 再补一次定稿。
          IN_NIGHT=$([ $H10 -ge $((10#1302)) ] && [ $H10 -le $((10#1458)) ] && echo 1 || echo 0)
          if [ "$DOW" -le 5 ] && { [ "$IN_AM" = 1 ] || [ "$IN_PM" = 1 ] || [ "$IN_BREAK" = 1 ] || [ "$IN_NIGHT" = 1 ]; }; then
            if [ "$IN_BREAK" = 1 ]; then sleep 240; fi   # 午休：约 5 分钟一轮，只保链不断
            sleep 60
            for i in 1 2 3; do
              curl -s -X POST -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/refresh.yml/dispatches" \
                -d '{"ref":"main"}' -w "self-dispatch HTTP %{http_code}\n" && break || sleep 5
            done
          else
            echo "非交易时段（UTC $H, dow=$DOW），不续跑"
          fi
