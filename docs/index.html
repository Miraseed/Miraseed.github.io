<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f6f8">
<title>期权卖方信号监控</title>
<style>
:root{
  /* 同花顺风格：浅灰底 + 白卡片 + 清晰分隔 */
  --bg:#f4f5f7; --card:#ffffff; --line:#e6e8eb; --line2:#eef0f3;
  --fg:#1a1a1a; --fg2:#4a4a4a; --fg3:#8a8f99;
  --red:#e63946;        /* 涨 = 红 */
  --red2:#ff6b6b;
  --red-bg:#fdecee;
  --green:#0f9d58;      /* 跌 = 绿 */
  --green2:#34c759;
  --green-bg:#e8f6ee;
  --amber:#e8a33d;
  --blue:#2b6cb0;
  --blue-bg:#eaf1f9;
  --radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;padding-bottom:40px;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:9px;padding:11px 0}
.hd h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green2);flex:none;
  box-shadow:0 0 0 0 rgba(52,199,89,.5);animation:pulse 2s infinite}
.dot.bad{background:var(--red);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.45)}70%{box-shadow:0 0 0 7px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}
.hd .meta{margin-left:auto;font-size:11px;color:var(--fg3);text-align:right;line-height:1.35}
.hd .meta b{color:var(--fg2);font-weight:500}

/* ---------- 概览条 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px;text-align:center;box-shadow:var(--shadow)}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:10px;color:var(--fg3);margin-top:2px}
.stat.hot .v{color:var(--red)}
.stat.calm .v{color:var(--green)}

/* ---------- 页签 ---------- */
.tabs{display:flex;gap:6px;margin:14px 0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 15px;border-radius:8px;background:var(--card);
  border:1px solid var(--line);color:var(--fg2);font-size:13px;cursor:pointer;white-space:nowrap;
  transition:.15s}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}

/* ---------- 卡片 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.card.sig{border-color:rgba(230,57,70,.35);
  background:linear-gradient(180deg,var(--red-bg),var(--card) 55%)}
.card.sig::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
.c-top{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.c-name{font-size:16px;font-weight:700;letter-spacing:.2px}
.c-px-wrap{margin-left:auto;text-align:right;display:flex;align-items:baseline;gap:7px}
.c-px{font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;letter-spacing:.2px}
.c-chg{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;
  padding:1px 7px;border-radius:5px}
.c-chg.up{color:var(--red);background:var(--red-bg)}
.c-chg.down{color:var(--green);background:var(--green-bg)}
.c-chg.flat{color:var(--fg3);background:var(--line2)}
.c-px.up{color:var(--red)} .c-px.down{color:var(--green)}
.badge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap;flex:none}
.badge.sig{background:var(--red-bg);color:var(--red);border:1px solid rgba(230,57,70,.28)}
.badge.wait{background:var(--line2);color:var(--fg3);border:1px solid var(--line)}
.badge.err{background:#fdf3e3;color:var(--amber);border:1px solid rgba(232,163,61,.3)}

.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line2);
  border-radius:8px;overflow:hidden;margin-bottom:10px}
.kv>div{background:#fafbfc;padding:8px 9px}
.kv .k{font-size:10px;color:var(--fg3);margin-bottom:2px}
.kv .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg)}
.v.up{color:var(--red)} .v.down{color:var(--green)}

/* IV 分位条 */
.bar{height:4px;background:var(--line2);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .5s}
.bar i.hot{background:var(--red)} .bar i.quiet{background:var(--green)}

.row{display:flex;gap:8px;font-size:12px;padding:5px 0;border-top:1px solid var(--line2)}
.row .rk{color:var(--fg3);flex:none;min-width:58px}
.row .rv{color:var(--fg2);word-break:break-all}
.strat{background:var(--blue-bg);border-radius:8px;padding:9px 11px;font-size:12.5px;
  color:var(--fg2);margin-top:9px;line-height:1.6;border-left:3px solid var(--blue)}
.card.sig .strat{background:var(--red-bg);border-left-color:var(--red)}

/* ---------- 表格 ---------- */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
th{background:#fafbfc;color:var(--fg3);font-weight:600;font-size:11px;
  text-align:left;padding:10px 11px;position:sticky;top:0;border-bottom:1px solid var(--line)}
td{padding:9px 11px;border-bottom:1px solid var(--line2);
  font-variant-numeric:tabular-nums;color:var(--fg2)}
tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:#fcfcfd}
th.sortable{cursor:pointer;user-select:none;-webkit-user-select:none}
th.sortable:hover{color:var(--blue)}
th.sortable.on{color:var(--blue);font-weight:700}
td.num{text-align:right}
td.ts{color:var(--fg3);font-size:11.5px;white-space:nowrap}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;margin-left:5px}
.tag.low{background:#fdf3e3;color:var(--amber)}
.tag.near{background:#fdeceb;color:var(--red)}
.tag.ref{background:var(--blue-bg);color:var(--blue);font-weight:600}
tr.refmon{background:#f7fafd}
.empty{padding:34px 16px;text-align:center;color:var(--fg3);font-size:13px}

/* ---------- 底栏 ---------- */
footer{text-align:center;color:var(--fg3);font-size:11px;padding:24px 14px 8px;line-height:1.8}
.hide{display:none!important}

/* ---------- 密码门（浅色） ---------- */
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;
  align-items:center;justify-content:center;padding:20px}
#gate .gbox{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:30px 26px;max-width:340px;width:100%;text-align:center}
#gate .gicon{font-size:34px;margin-bottom:8px}
#gate h2{font-size:16px;margin:0 0 6px;font-weight:700;color:var(--fg)}
#gate p{font-size:12px;color:var(--fg3);margin:0 0 16px}
#gate input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
  background:#fafbfc;color:var(--fg);font-size:15px;outline:none;text-align:center;
  letter-spacing:1px;margin-bottom:10px}
#gate input:focus{border-color:var(--blue)}
#gate button{width:100%;padding:11px;border-radius:10px;border:none;background:var(--blue);
  color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#gate button:active{opacity:.85}
#gate .gerr{color:var(--red);font-size:12px;min-height:16px;margin-top:8px}
@media(max-width:420px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  .c-px{font-size:15px}
}
/* ---------- K线复盘 ---------- */
.kpbar{display:flex;align-items:center;gap:10px;margin:0 0 8px;flex-wrap:wrap}
.kpbar select{background:var(--card);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.kchips{display:flex;gap:6px}
.kchip{font-size:12px;padding:5px 11px;border-radius:7px;background:var(--card);
  border:1px solid var(--line);color:var(--fg2);cursor:pointer;user-select:none;
  font-variant-numeric:tabular-nums}
.kchip.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.klegend{margin-left:auto;font-size:11.5px;color:var(--fg2);display:flex;gap:10px;flex-wrap:wrap}
.klegend i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.klegend s{width:9px;height:9px;border-radius:2px;display:inline-block;text-decoration:none}
.kchart{position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:6px;overflow:hidden}
.kchart canvas{display:block;width:100%;height:auto}
.ktip{font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums;
  padding:6px 4px 2px;min-height:18px;line-height:1.6}
.kmeta{margin-top:8px}
.kmeta td{padding:6px 10px;font-size:12.5px}
.kmeta td:first-child{color:var(--fg2);width:36%}
</style>
</head>
<body>

<!-- 访问密码门 -->
<div id="gate">
  <div class="gbox">
    <div class="gicon">🔐</div>
    <h2>期权卖方信号监控</h2>
    <p>私有页面，请输入访问密码</p>
    <input type="password" id="gPwd" placeholder="访问密码" autocomplete="off">
    <button id="gGo">进入</button>
    <div class="gerr" id="gErr"></div>
  </div>
</div>

<header>
  <div class="wrap hd">
    <span class="dot" id="dot"></span>
    <h1>期权卖方信号监控</h1>
    <div class="meta">
      <div>数据 <b id="mRun">—</b></div>
      <div id="mState">连接中…</div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="stats">
    <div class="stat" id="sPool"><div class="v">—</div><div class="k">监控标的</div></div>
    <div class="stat hot" id="sSig"><div class="v">—</div><div class="k">触发信号</div></div>
    <div class="stat calm" id="sWait"><div class="v">—</div><div class="k">观望</div></div>
    <div class="stat" id="sCost"><div class="v">—</div><div class="k">刷新耗时</div></div>
  </div>

  <div class="tabs">
    <div class="tab on" data-t="board">信号看板</div>
    <div class="tab" data-t="kline">K线复盘</div>
    <div class="tab" data-t="atm">合约IV对照</div>
    <div class="tab" data-t="hist">历史信号</div>
  </div>

  <section id="p-board"><div class="grid" id="board"></div></section>

  <section id="p-kline" class="hide">
    <div class="kpbar">
      <select id="kProd"></select>
      <span class="kchips">
        <span class="kchip" data-n="60">60日</span>
        <span class="kchip" data-n="120">120日</span>
        <span class="kchip" data-n="250">250日</span>
        <span class="kchip" data-n="500">500日</span>
        <span class="kchip on" data-n="9999">全部</span>
      </span>
      <span class="klegend" id="kLeg"></span>
    </div>
    <div class="kchart"><canvas id="kCv"></canvas></div>
    <div class="ktip" id="kTip">—</div>
    <div class="tblwrap kmeta"><table><tbody id="kMeta"></tbody></table></div>
  </section>

  <section id="p-atm" class="hide">
    <div class="tblwrap">
      <table>
        <thead><tr><th>合约月</th><th>品种</th><th style="text-align:right">ATM IV</th>
          <th style="text-align:right">平值行权价</th><th style="text-align:right">剩余天数</th>
          <th style="text-align:right">样本数</th><th>行情时间戳</th></tr></thead>
        <tbody id="atmBody"></tbody>
      </table>
    </div>
  </section>

  <section id="p-hist" class="hide">
    <div class="tblwrap">
      <table>
        <thead><tr>
          <th class="sortable" data-k="ts">触发时间</th><th class="sortable" data-k="name">标的</th>
          <th class="sortable num" data-k="iv" style="text-align:right">ATM IV</th>
          <th class="sortable num" data-k="pct" style="text-align:right">IV分位</th>
          <th>建议合约</th><th>触发原因</th></tr></thead>
        <tbody id="histBody"></tbody>
      </table>
    </div>
  </section>
</div>

<footer>
  GitHub Pages 静态版：交易时段每3分钟自动刷新（全部标的走新浪实时链，BS 反解 IV）· 各卡片与表格均标注行情时间戳 · 数据仅供参考，不构成投资建议<br>
  <span id="fPush"></span>
</footer>

<script>
const $ = id => document.getElementById(id);
// HTML 转义：数据字段一律先转义再拼进 innerHTML，防止注入
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 数值守卫：空串/非数字统一返回 '—'，避免渲染出 NaN / 0.00
const _okNum = v => (v===null||v===undefined||v===''||isNaN(v)) ? null : Number(v);
const pct = (v,d=1) => { const x=_okNum(v); return x===null ? '—' : (x*100).toFixed(d)+'%'; };
const num = (v,d=2) => { const x=_okNum(v); return x===null ? '—' : x.toFixed(d); };
let TIMER=null, FAILS=0;

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    ['board','kline','atm','hist'].forEach(k=>$('p-'+k).classList.toggle('hide', k!==t.dataset.t));
    if(t.dataset.t==='kline') drawKline();
  };
});

/* ================= K线复盘（Canvas 手绘，风格参考同花顺期货通） ================= */
let KL = null;            // kline.json 全量
let KN = 9999;            // 可视根数（默认全部）
let KV0 = 0;              // 可视起点在全集中的索引（缩放/拖动）
let KHOV = -1;            // 悬浮索引
let KYHV = -1;            // 悬浮 Y 像素（十字横线）
const KMAS = [[5,'#e8a33d'],[10,'#4a9eff'],[20,'#c77dff'],[60,'#7bd88f']];

function maAt(closes, i, n){
  if(i < n-1) return null;
  let s=0; for(let k=i-n+1;k<=i;k++) s+=closes[k];
  return s/n;
}
function kview(total){
  KN = Math.max(15, Math.min(KN, total));
  if(KV0 + KN > total) KV0 = total - KN;
  if(KV0 < 0) KV0 = 0;
}

function drawKline(){
  const cv = $('kCv'); if(!cv || !KL) return;
  const name = $('kProd').value;
  const p = KL.products[name]; if(!p) return;
  const total = p.bars.length;
  kview(total);
  const bars = p.bars.slice(KV0, KV0+KN), pcts = p.pct.slice(KV0, KV0+KN), sigs = p.sig.slice(KV0, KV0+KN);
  const n = bars.length;
  const closes = bars.map(b=>b[4]);
  const mas = KMAS.map(([m,c])=>({m,c,arr:bars.map((_,i)=>maAt(closes,i,m))})).filter(x=>x.arr.some(v=>v!=null));

  // 尺寸（DPR 适配，保证清晰）
  const dpr = window.devicePixelRatio||1;
  const W = cv.parentElement.clientWidth - 12;
  const H = Math.max(340, Math.min(460, W*0.72));
  const PADL=52, PADR=10, PADT=10;
  const volH = 52;                      // IV分位副图高
  const gap = 16;
  const mainH = H - PADT - volH - gap - 20;   // 20 给底部日期
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const css = getComputedStyle(document.documentElement);
  const C = k => css.getPropertyValue(k).trim();
  const fg = C('--fg')||'#e6e6e6', fg2 = C('--fg2')||'#9aa0a6', line = C('--line')||'#2a2f3a';
  const blue = C('--blue')||'#2f6fd6';
  const red = '#e63946', green = '#26a65b';
  g.clearRect(0,0,W,H);

  // 主图价格范围（含 MA）
  let hi = -Infinity, lo = Infinity;
  bars.forEach(b=>{ hi=Math.max(hi,b[2]); lo=Math.min(lo,b[3]); });
  mas.forEach(x=>x.arr.forEach(v=>{ if(v!=null){ hi=Math.max(hi,v); lo=Math.min(lo,v); } }));
  const pad = (hi-lo)*0.06 || hi*0.01;
  hi += pad; lo -= pad;
  const x0 = PADL, plotW = W - PADL - PADR;
  const bw = plotW/n;
  const cw = Math.max(1, Math.min(9, bw*0.68));
  const Y = v => PADT + (hi-v)/(hi-lo)*mainH;
  const X = i => x0 + (i+0.5)*bw;
  const pv = y => hi - (y-PADT)/mainH*(hi-lo);   // 像素 -> 价格

  // 网格 + 左侧价格刻度
  g.strokeStyle = line; g.lineWidth = 1; g.globalAlpha = .55;
  g.font = '10px -apple-system,sans-serif'; g.textAlign='right'; g.textBaseline='middle';
  for(let i=0;i<=4;i++){
    const y = PADT + mainH*i/4, v = hi - (hi-lo)*i/4;
    g.beginPath(); g.moveTo(x0,y); g.lineTo(x0+plotW,y); g.stroke();
    g.globalAlpha=1; g.fillStyle=fg2;
    const dec = v>=1000?0:(v>=10?1:3);
    g.fillText(v.toFixed(dec), x0-6, y);
    g.globalAlpha=.55;
  }
  g.globalAlpha=1;

  // K线：涨红跌绿（中国习惯）
  bars.forEach((b,i)=>{
    const [d,o,h,l,c] = b;
    const up = c>=o, col = up?red:green;
    const cx = X(i);
    g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1;
    g.beginPath(); g.moveTo(cx, Y(h)); g.lineTo(cx, Y(l)); g.stroke();
    const yo = Y(o), yc = Y(c);
    const top = Math.min(yo,yc), hh = Math.max(1, Math.abs(yc-yo));
    if(up){ g.fillRect(cx-cw/2, top, cw, hh); }
    else  { g.fillRect(cx-cw/2, top, cw, hh); }
  });

  // MA 线
  mas.forEach(({m,c,arr})=>{
    g.strokeStyle=c; g.lineWidth=1.1; g.beginPath();
    let started=false;
    arr.forEach((v,i)=>{ if(v==null) return;
      const x=X(i), y=Y(v);
      if(!started){ g.moveTo(x,y); started=true; } else g.lineTo(x,y);
    });
    g.stroke();
  });

  // 信号日标记：主图下方 ▲（红三角+白心效果用双层画法）
  sigs.forEach((s,i)=>{
    if(!s) return;
    const x = X(i), y = Math.min(mainH+PADT-4, Y(bars[i][3])+9);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x-4.5, y+7); g.lineTo(x+4.5, y+7); g.closePath();
    g.fillStyle='#ff5a5f'; g.fill();
    g.strokeStyle='#fff'; g.lineWidth=.9; g.stroke();
  });

  // ---- IV 分位副图 ----
  const vy = PADT + mainH + gap;
  g.strokeStyle=line; g.globalAlpha=.55;
  g.beginPath(); g.moveTo(x0,vy); g.lineTo(x0+plotW,vy); g.stroke();
  g.globalAlpha=1;
  g.fillStyle=fg2; g.font='10px -apple-system,sans-serif';
  g.fillText('IV分位', 4, vy-8);
  const VY = v => vy + volH - v*volH;
  // 阈值参考线
  g.strokeStyle='rgba(255,90,95,.75)'; g.setLineDash([4,3]); g.lineWidth=1;
  g.beginPath(); g.moveTo(x0, VY(p.th)); g.lineTo(x0+plotW, VY(p.th)); g.stroke();
  g.setLineDash([]);
  g.fillStyle='rgba(255,90,95,.9)';
  g.textAlign='right'; g.fillText((p.th*100).toFixed(0)+'%', x0-6, VY(p.th)); g.textAlign='left';
  // 分位折线
  g.strokeStyle='#4a9eff'; g.lineWidth=1.3; g.beginPath();
  let st2=false;
  pcts.forEach((v,i)=>{ if(v==null) return; const x=X(i), y=VY(v);
    if(!st2){ g.moveTo(x,y); st2=true; } else g.lineTo(x,y); });
  g.stroke();
  // 副图信号点
  sigs.forEach((s,i)=>{ if(!s||pcts[i]==null) return;
    g.beginPath(); g.arc(X(i), VY(pcts[i]), 2.4, 0, 6.284);
    g.fillStyle='#ff5a5f'; g.fill(); });

  // 底部日期刻度（首/中/末 + 十字线日期）
  g.fillStyle=fg2; g.textAlign='center';
  [0, Math.floor(n/2), n-1].forEach(i=>{
    if(!bars[i]) return;
    g.fillText(bars[i][0].slice(2), X(i), H-6);
  });
  g.textAlign='left';

  // 悬浮十字线（竖线 + 横线 + 蓝底坐标标签，参考同花顺）
  if(KHOV>=0 && KHOV<n){
    const i=KHOV, x=X(i);
    const yv = KYHV>=PADT && KYHV<=PADT+mainH ? KYHV : Y(bars[i][4]);
    g.strokeStyle='rgba(170,180,200,.6)'; g.setLineDash([4,3]); g.lineWidth=1;
    g.beginPath(); g.moveTo(x,PADT); g.lineTo(x,PADT+mainH+gap+volH); g.stroke();
    g.beginPath(); g.moveTo(x0,yv); g.lineTo(x0+plotW,yv); g.stroke();
    g.setLineDash([]);
    // 底部日期标签（蓝底）
    const dtxt = bars[i][0];
    g.font='11px -apple-system,sans-serif';
    const dw = g.measureText(dtxt).width + 12;
    const dx = Math.max(x0, Math.min(x-dw/2, x0+plotW-dw));
    g.fillStyle=blue;
    g.fillRect(dx, H-17, dw, 15);
    g.fillStyle='#fff'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(dtxt, dx+dw/2, H-9.5);
    // 左侧价格标签（蓝底，主图区）
    if(yv>=PADT && yv<=PADT+mainH){
      const v = pv(yv);
      const dec = v>=1000?0:(v>=10?2:3);
      const ptxt = v.toFixed(dec);
      const pw2 = g.measureText(ptxt).width + 10;
      g.fillStyle=blue;
      g.fillRect(2, yv-8, Math.max(pw2, PADL-6), 16);
      g.fillStyle='#fff';
      g.fillText(ptxt, 2+(Math.max(pw2, PADL-6))/2, yv);
    }
    g.textAlign='left'; g.textBaseline='alphabetic';
  }

  // 图例
  $('kLeg').innerHTML = mas.map(({m,c})=>
    `<i><s style="background:${c}"></s>MA${m}</i>`).join('')
    + `<i><s style="background:#ff5a5f;border-radius:50%"></s>信号日</i>`
    + `<i><s style="background:#4a9eff"></s>IV分位</i>`;

  // 赋值给交互事件使用
  cv._ctx = {X, Y, VY, n, bars, pcts, sigs, x0, plotW, mainH, PADT, gap, volH, hi, lo, total};
  // 底部数值表
  const cnt = sigs.reduce((a,b)=>a+b,0);
  const last = bars[n-1], prev = n>1?bars[n-2]:null;
  const chg = prev ? (last[4]/prev[4]-1) : null;
  const dec = last[4]>=1000?2:(last[4]>=10?2:4);
  $('kMeta').innerHTML = [
    [(p.live?'最新盘中':'最新收盘'), `${last[4].toFixed(dec)}　<span style="color:${chg>0?red:(chg<0?green:fg2)}">${chg==null?'—':((chg>0?'+':'')+(chg*100).toFixed(2)+'%')}</span>${p.live?'　<span style="color:#e6a23c;font-size:11px">● 实时</span>':''}`],
    ['区间', `${bars[0][0]} ~ ${last[0]}（${n} 根）`],
    ['信号阈值', `IV分位 ≥ ${(p.th*100).toFixed(0)}%${p.iv_th?` 且 ATM IV ≥ ${(p.iv_th*100).toFixed(0)}%`:''}`],
    ['区间信号日', `${cnt} 天`],
    ['当前IV分位', pcts[n-1]==null?'—':`${(pcts[n-1]*100).toFixed(0)}%`],
    ['IV数据起点', p.iv_from?`${p.iv_from}（期权上市，之前无 IV 数据）`:'—'],
  ].map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('');
  if(KHOV < 0)
    $('kTip').textContent = '滚轮/双指缩放 · 拖动平移 · 轻点开启十字线（再点关闭）；▲ 为当日触发卖沽信号的交易日';
}

function klineHover(clientX, clientY){
  const cv=$('kCv'); if(!cv||!cv._ctx) return;
  const r = cv.getBoundingClientRect();
  const {X, n, bars, pcts, sigs, mainH, PADT} = cv._ctx;
  const x = clientX - r.left, y = clientY - r.top;
  let best=-1, bd=1e9;
  for(let i=0;i<n;i++){ const d=Math.abs(X(i)-x); if(d<bd){bd=d;best=i;} }
  if(bd > 40){ KHOV=-1; return; }
  KYHV = Math.max(PADT, Math.min(mainH+PADT, y));
  if(best===KHOV) { drawKline(); return; }
  KHOV=best;
  const b=bars[best], dec=b[4]>=1000?2:(b[4]>=10?2:4);
  const ch = best>0 ? bars[best-1][4] : null;
  const cc = ch ? ((b[4]/ch-1)*100).toFixed(2)+'%' : '—';
  $('kTip').innerHTML = `<b>${esc(b[0])}</b>　开 ${b[1].toFixed(dec)}　高 ${b[2].toFixed(dec)}　`
    + `低 ${b[3].toFixed(dec)}　收 <b>${b[4].toFixed(dec)}</b>（${cc}）　`
    + `IV分位 ${pcts[best]==null?'—':(pcts[best]*100).toFixed(0)+'%'}`
    + (best===n-1 && KL.products[$('kProd').value]?.live ? '　<span style="color:#e6a23c">● 实时</span>' : '')
    + (sigs[best]?'　<span style="color:#ff5a5f;font-weight:700">▲ 卖沽信号</span>':'');
  drawKline();
}

// ---- 缩放 / 拖动（滚轮 + 鼠标拖动 + 触摸双指捏合）----
function kZoom(cursorX, factor){
  const cv=$('kCv'); if(!cv||!cv._ctx) return;
  const {x0, plotW, n} = cv._ctx;
  const total = KL.products[$('kProd').value].bars.length;
  const frac = Math.max(0, Math.min(1, (cursorX - x0) / plotW));
  const anchor = KV0 + Math.floor(frac * n);          // 光标处的全局索引
  const newN = Math.max(15, Math.min(total, Math.round(KN * factor)));
  KV0 = Math.round(anchor - frac * newN);
  KN = newN;
  kview(total);
  drawKline();
}
function initKline(){
  if(!KL) return;
  const sel=$('kProd');
  if(!sel.options.length){
    sel.innerHTML = Object.keys(KL.products).map(k=>`<option>${esc(k)}</option>`).join('');
    sel.onchange = ()=>{ KHOV=-1; KYHV=-1;
      KV0 = Math.max(0, KL.products[sel.value].bars.length - KN); drawKline(); };
    document.querySelectorAll('.kchip').forEach(c=>{
      c.onclick=()=>{ document.querySelectorAll('.kchip').forEach(x=>x.classList.remove('on'));
        c.classList.add('on'); KN=+c.dataset.n; KHOV=-1; KYHV=-1;
        KV0 = Math.max(0, KL.products[sel.value].bars.length - Math.min(KN, KL.products[sel.value].bars.length));
        drawKline(); };
    });
    const cv=$('kCv');
    // 滚轮缩放（以光标为锚点）
    cv.addEventListener('wheel', e=>{
      e.preventDefault();
      if(!cv._ctx) return;
      const r = cv.getBoundingClientRect();
      kZoom(e.clientX - r.left, e.deltaY < 0 ? 0.82 : 1/0.82);
    }, {passive:false});
    // 指针事件：悬停十字线（鼠标）；tap 切换十字线（触摸）；单指拖动平移；双指捏合缩放
    const ptrs = new Map();
    let dragStart = null, pinch0 = null, KCROSS = false;
    cv.addEventListener('pointerdown', e=>{
      try{ cv.setPointerCapture(e.pointerId); }catch(_){}
      ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(ptrs.size === 1){
        dragStart = {x:e.clientX, kv0:KV0, t:Date.now(), moved:false};
      }else if(ptrs.size === 2){
        dragStart = null;
        const [a,b] = [...ptrs.values()];
        pinch0 = {d: Math.abs(a.x-b.x)||1, n:KN, mid:(a.x+b.x)/2};
      }
    });
    cv.addEventListener('pointermove', e=>{
      if(!ptrs.has(e.pointerId)){        // 纯悬停（鼠标）
        klineHover(e.clientX, e.clientY); return;
      }
      ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(ptrs.size === 2 && pinch0){
        const [a,b] = [...ptrs.values()];
        const d = Math.abs(a.x-b.x)||1;
        const r = cv.getBoundingClientRect();
        KHOV=-1; KYHV=-1;
        kZoom(pinch0.mid - r.left, Math.max(0.2, Math.min(5, pinch0.d/d)));
        return;
      }
      if(KCROSS){                        // 十字线模式：跟随手指/鼠标
        klineHover(e.clientX, e.clientY); return;
      }
      if(dragStart && cv._ctx){          // 平移模式
        const {plotW, n} = cv._ctx;
        const total = KL.products[$('kProd').value].bars.length;
        const bw = plotW/n;
        const dx = e.clientX - dragStart.x;
        if(Math.abs(dx) > 8) dragStart.moved = true;
        KHOV=-1; KYHV=-1;
        KV0 = Math.max(0, Math.min(total-KN, dragStart.kv0 - Math.round(dx/bw)));
        drawKline();
      }
    });
    const up = e=>{
      // tap（未移动、按压短）→ 切换十字线模式
      if(dragStart && !dragStart.moved && Date.now()-dragStart.t < 500 && KCROSSable(e)){
        KCROSS = !KCROSS;
        if(KCROSS) klineHover(e.clientX, e.clientY);
        else { KHOV=-1; KYHV=-1; drawKline(); }
      }
      ptrs.delete(e.pointerId);
      if(ptrs.size < 2) pinch0 = null;
      if(ptrs.size === 0) dragStart = null;
    };
    const KCROSSable = e => {
      const r = cv.getBoundingClientRect();
      const x = e.clientX-r.left, y = e.clientY-r.top;
      return x>=0 && y>=0 && x<=r.width && y<=r.height;
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', e=>{
      ptrs.delete(e.pointerId); pinch0 = null; dragStart = null;
    });
    cv.addEventListener('pointerleave', e=>{
      up(e);
      if(!ptrs.size && !KCROSS){ KHOV=-1; KYHV=-1; drawKline(); }
    });
    cv.style.touchAction = 'none';       // 允许自定义手势
    cv.style.cursor = 'crosshair';
    // 切换标的/周期时退出十字线模式
    const _resetCross = ()=>{ KCROSS=false; KHOV=-1; KYHV=-1; };
    const _oldSel = sel.onchange;
    sel.onchange = ()=>{ _resetCross(); _oldSel(); };
    document.querySelectorAll('.kchip').forEach(c=>{
      const old = c.onclick;
      c.onclick = e=>{ _resetCross(); old(e); };
    });
    window.addEventListener('resize', ()=>{ if(!$('p-kline').classList.contains('hide')) drawKline(); });
  }
  drawKline();
}
async function loadKline(){
  try{
    const r = await fetch('kline.enc.txt?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const blob = await r.json();
    KL = await decryptBlob(PWD, blob);
    initKline();
  }catch(e){ /* 缺 K线数据不影响主看板 */ }
}

function card(r){
  const isSig = String(r['信号']||'').includes('★');
  const isHint = String(r['信号']||'').includes('仅观察');
  const isErr = String(r['状态']||'')==='数据缺失' || String(r['状态']||'')==='异常';
  const cls = isSig ? 'card sig' : 'card';
  const badge = isSig ? '<span class="badge sig">★ 卖出认沽</span>'
              : isHint ? '<span class="badge wait">⊙ 仅观察</span>'
              : isErr ? '<span class="badge err">数据异常</span>'
              : '<span class="badge wait">观望</span>';

  // ---- 价格 + 涨跌幅（涨红跌绿）----
  const S = r['S'], chg = r['涨跌幅'];
  const hasChg = (chg!==null && chg!==undefined && !isNaN(chg));
  const dir = !hasChg ? 'flat' : (chg>0.0001?'up':(chg<-0.0001?'down':'flat'));
  const chgTxt = !hasChg ? '—' : ((chg>0?'+':'')+ (chg*100).toFixed(2) + '%');
  // 展示小数位：优先后端给的「价格位数」（铁矿石=1 位，对齐期货通）；缺失则按量级推断
  const _sx = _okNum(S);
  const sDec = (_okNum(r['价格位数'])!==null) ? r['价格位数'] : (_sx!==null && Math.abs(_sx)>=1000 ? 2 : 4);
  const pxHtml = `<div class="c-px-wrap">
      <span class="c-px ${dir!=='flat'?dir:''}">${num(S, sDec)}</span>
      <span class="c-chg ${dir}">${chgTxt}</span>
    </div>`;

  const q = r['IV分位'];
  const qcls = (q!==null&&q>=0.75) ? 'hot' : (q!==null&&q<=0.35 ? 'quiet' : '');
  const w = (q!==null&&q!==undefined) ? Math.round(q*100) : 0;

  const ts = r['期限结构'];
  let tsHtml='—';
  if(ts!==null&&ts!==undefined&&!isNaN(ts)){
    const c = ts>=0.05?'up':(ts<=-0.03?'down':'');
    const nv = r['近月IV'], xv = r['次近月IV'];
    const tip = (nv!=null&&xv!=null) ? ` title="近月 ${(nv*100).toFixed(1)}% − 次近月 ${(xv*100).toFixed(1)}%"` : '';
    tsHtml = `<span class="${c}"${tip}>${(ts*100).toFixed(1)>0?'+':''}${(ts*100).toFixed(1)}%</span>`;
  }

  const kv = `
    <div class="kv">
      <div><div class="k">ATM IV</div><div class="v">${pct(r['ATM_IV'])}</div></div>
      <div><div class="k">IV 分位</div><div class="v ${qcls==='hot'?'up':''}">${q===null||q===undefined?'—':Math.round(q*100)+'%'}
        <div class="bar"><i class="${qcls}" style="width:${w}%"></i></div></div></div>
      <div><div class="k">期限结构</div><div class="v">${tsHtml}</div></div>
    </div>`;

  const rows = [];
  if(r['建议合约'] && r['建议合约']!=='—')
    rows.push(`<div class="row"><span class="rk">建议合约</span><span class="rv">${esc(r['建议合约'])}　Δ${num(r['建议Delta'],2)}　剩${r['剩余天数']??'—'}天</span></div>`);
  if(r['结构提示'] && r['结构提示']!=='—')
    rows.push(`<div class="row"><span class="rk">数据来源</span><span class="rv">${esc(r['结构提示'])}</span></div>`);
  if(r['触发原因'] && r['触发原因']!=='—')
    rows.push(`<div class="row"><span class="rk">触发原因</span><span class="rv">${esc(r['触发原因'])}</span></div>`);
  if(r['行情时间戳'])
    rows.push(`<div class="row"><span class="rk">行情时间</span><span class="rv" style="color:var(--fg3)">${esc(r['行情时间戳'])}</span></div>`);

  const strat = r['建议策略'] ? `<div class="strat">${esc(r['建议策略'])}</div>` : '';

  return `<div class="${cls}">
    <div class="c-top">
      <span class="c-name">${esc(r['标的']||'—')}</span>
      ${badge}
      ${pxHtml}
    </div>
    ${kv}${rows.join('')}${strat}
  </div>`;
}

/* ---------- 历史信号排序：默认触发时间降序，前四列点击切换 ---------- */
let HIST_DATA = [];                      // 最近一次的历史数据
let HIST_SORT = {key:'ts', dir:-1};      // ts/name/iv/pct；dir -1=降序 1=升序
const HKEY = {ts:'时间戳', name:'标的', iv:'ATM_IV', pct:'IV分位'};

function histVal(h, key){
  if(key==='ts')  return h['时间戳']||h['日期']||'';
  if(key==='name')return h['标的']||'';
  const v = parseFloat(h[HKEY[key]]);
  return isNaN(v) ? -Infinity : v;
}
function renderHist(hist){
  HIST_DATA = hist||[];
  const {key, dir} = HIST_SORT;
  const rows = [...HIST_DATA].sort((a,b)=>{
    const va = histVal(a,key), vb = histVal(b,key);
    return (va<vb?-1:va>vb?1:0)*dir;
  });
  $('histBody').innerHTML = rows.length ? rows.map(h=>`<tr>
    <td class="ts">${esc(h['时间戳']||h['日期']||'')}</td>
    <td>${esc(h['标的']||'')}</td>
    <td class="num">${pct(h['ATM_IV'])}</td>
    <td class="num">${pct(h['IV分位'],0)}</td>
    <td>${esc(h['建议合约']||'—')}</td>
    <td>${esc(h['触发原因']||'—')}</td>
  </tr>`).join('') : '<tr><td colspan="6" class="empty">暂无历史触发记录</td></tr>';
  // 表头箭头
  document.querySelectorAll('#p-hist th.sortable').forEach(th=>{
    const k = th.dataset.k;
    th.innerHTML = th.textContent.replace(/[▲▼]\s*$/,'').trim()
      + (k===key ? (dir<0?' ▼':' ▲') : '');
    th.classList.toggle('on', k===key);
  });
}
function initHistSort(){
  document.querySelectorAll('#p-hist th.sortable').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.k;
      if(HIST_SORT.key===k) HIST_SORT.dir *= -1;      // 同列再点反向
      else HIST_SORT = {key:k, dir: k==='name' ? 1 : -1};  // 新列：文本升序，数值/时间降序
      renderHist(HIST_DATA);
    });
  });
}

/* ---------- 密码门解密（AES-GCM + PBKDF2）：正确密码才解锁 ---------- */
async function decryptBlob(pwd, blob){
  const salt = Uint8Array.from(atob(blob.salt), c=>c.charCodeAt(0));
  const iv   = Uint8Array.from(atob(blob.iv),   c=>c.charCodeAt(0));
  const ct   = Uint8Array.from(atob(blob.ct),   c=>c.charCodeAt(0));
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, hash:'SHA-256', iterations: blob.iter||100000},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

let PWD = localStorage.getItem('om_pwd') || null;
async function loadSnap(){
  const r = await fetch('data.enc.txt?t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('http '+r.status);
  const blob = await r.json();
  return await decryptBlob(PWD, blob);
}

async function pull(){
  if(!PWD) return;
  try{
    const s = await loadSnap();
    FAILS=0; render(s);
    if(!KL) loadKline();      // K线数据加载一次即可（失败不影响主看板）
  }catch(e){
    FAILS++;
    if(String(e).includes('OperationError') || String(e).includes('Cipher')){
      PWD=null; localStorage.removeItem('om_pwd');
      $('gate').classList.remove('hide');
      $('gErr').textContent='密码已失效，请重新输入';
      return;
    }
    $('dot').classList.add('bad');
    $('mState').innerHTML='<span style="color:#e63946">连接失败，重试中…</span>';
  }
}
async function tryGate(){
  const pwd = $('gPwd').value.trim();
  if(!pwd){ $('gErr').textContent='请输入密码'; return; }
  $('gErr').textContent='验证中…';
  const old = PWD; PWD = pwd;
  try{
    const s = await loadSnap();
    localStorage.setItem('om_pwd', pwd);
    $('gate').classList.add('hide');
    FAILS=0; render(s);
    if(!KL) loadKline();
    startPolling();   // 首次登录也要启动定时轮询（幂等：先清旧计时器）
    $('gErr').textContent='';
  }catch(e){
    PWD = old;
    $('gErr').textContent = (String(e).includes('OperationError') || String(e).includes('Cipher'))
      ? '密码错误' : '数据加载失败，请稍后再试';
  }
}
$('gGo').onclick = tryGate;
$('gPwd').addEventListener('keydown', e=>{ if(e.key==='Enter') tryGate(); });

function startPolling(){
  if(TIMER) clearInterval(TIMER);      // 幂等：防止重复启动
  pull();
  if(!KL) loadKline();
  TIMER = setInterval(pull, 120000);   // 每2分钟拉一次最新数据
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pull(); });
}
if(PWD){ $('gate').classList.add('hide'); startPolling(); }
else { $('gPwd').focus(); }
</script>
</body>
</html>
